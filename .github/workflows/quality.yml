name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Backend (pylint + mypy + pytest/cov95-branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups --dev

      - name: Pylint
        run: bash script/lint.sh

      - name: Mypy
        run: bash script/mypy.sh

      # 显式传参：覆盖率门禁在 CI 输出中可见，不依赖 pyproject 隐式配置
      # pyproject 已同时设置 branch = true / fail_under = 95 作为本地兜底
      - name: Pytest + coverage (>=95%, branch)
        run: >
          uv run python -m pytest tests/ -q
          --cov=src/app --cov-branch --cov-fail-under=95
          --cov-report=term-missing

  security:
    name: Semgrep (0 findings, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"

      - name: Semgrep
        run: uvx semgrep scan --config auto --error src/app
